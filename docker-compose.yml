services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental_clinic_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dental_clinic
      - NODE_ENV=production
      - DB_SSL=false
      - SEED_ADMIN_PASSWORD=Admin@12345
      - SEED_STAFF_PASSWORD=Reception@12345
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: dental_clinic_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dental_clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dental_clinic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
